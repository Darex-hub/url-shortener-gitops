apiVersion: apps/v1
kind: Deployment
metadata:
  name: kutt
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kutt
  template:
    metadata:
      labels:
        app: kutt
    spec:
      containers:
        - name: kutt
          image: darexy101/kutt
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: kutt-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kutt-secrets
                  key: JWT_SECRET
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kutt-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kutt-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kutt
  namespace: url-shortener
spec:
  type: ClusterIP
  selector:
    app: kutt
  ports:
    - port: 3000
      targetPort: 3000